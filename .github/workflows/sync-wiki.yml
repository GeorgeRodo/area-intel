# Mirrors the pt-buyers-kb vault into Supabase (wiki_articles + wiki_links).
#
# Lives in this repo rather than the wiki repo so the workflow and the script
# it runs version together - a change to kb/sync_wiki.py can never be half
# deployed. The cost is that it has to fetch the vault, hence WIKI_REPO_TOKEN.
#
# Three triggers, in descending order of how much you should rely on them:
#   schedule          - hourly, and works with no setup in the wiki repo at all
#   repository_dispatch - instant, fired by the notifier workflow in pt-buyers-kb
#   workflow_dispatch - the "run it now" button in the Actions tab
#
# Secrets required (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL  - postgres connection string, service role / table owner.
#                      Supabase dashboard > Project Settings > Database > URI.
#                      Not the anon key: 0007 gives no client role write access.
#   WIKI_REPO_TOKEN  - PAT with contents:read on GeorgeRodo/pt-buyers-kb.
#                      Drop this and the `token:` line below if that repo is public.
#
# The sync is content-addressed and idempotent, so an hourly no-op run costs
# one query and writes nothing.

name: sync-wiki

on:
  schedule:
    - cron: "17 * * * *"     # hourly, off the hour: GitHub drops jobs queued at :00
  repository_dispatch:
    types: [wiki-updated]
  workflow_dispatch:

# A scheduled run and a push-triggered run colliding would have both trying to
# rewrite wiki_links. Serialise instead, and let the newer content win.
concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the dashboard (for kb/sync_wiki.py)
        uses: actions/checkout@v4

      - name: Check out the wiki
        uses: actions/checkout@v4
        with:
          repository: GeorgeRodo/pt-buyers-kb
          token: ${{ secrets.WIKI_REPO_TOKEN }}
          path: wiki
          # Full history is not needed, but the checkout must be a git repo:
          # sync_wiki.py reads HEAD from it to stamp wiki_articles.commit_sha.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet pyyaml psycopg2-binary

      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m kb.sync_wiki --wiki-path wiki
